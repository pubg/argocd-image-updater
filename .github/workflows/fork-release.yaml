name: Fork release image

on:
  push:
    tags:
      # Fork build tags: upstream version + commit sha suffix (e.g. v1.4.0-5bed5ad1),
      # the same convention as the other pubg forks. Upstream tags stay untouched.
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9a-f]+'

permissions: {}

jobs:
  test:
    if: github.repository == 'pubg/argocd-image-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run unit tests
        env:
          GNUPG_DISABLED: true
        run: make test

  image:
    needs: test
    # Native runner per arch: building arm64 under qemu exceeds the job timeout.
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          set -ex
          docker buildx build \
            -t "ghcr.io/pubg/argocd-image-updater:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --provenance=false \
            --sbom=false \
            --progress plain \
            --pull \
            --platform "linux/${{ matrix.arch }}" \
            --push \
            .

  manifest:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch index
        run: |
          set -ex
          IMAGE="ghcr.io/pubg/argocd-image-updater"
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"
