name: Fork release image

on:
  push:
    tags:
      # Fork build tags: upstream version + commit sha suffix (e.g. v0.18.0-fe0e8cc1),
      # the same convention as the other pubg forks. Upstream tags stay untouched.
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9a-f]+'

permissions: {}

jobs:
  test:
    if: github.repository == 'pubg/argocd-image-updater'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup qemu
        uses: docker/setup-qemu-action@v3
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          set -ex
          docker buildx build \
            -t "ghcr.io/pubg/argocd-image-updater:${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --progress plain \
            --pull \
            --platform linux/amd64,linux/arm64 \
            --push \
            .
